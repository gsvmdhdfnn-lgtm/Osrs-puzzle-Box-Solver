<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>OSRS Puzzle Solver</title>
  <link rel="stylesheet" href="ui/app.css">
</head>
<body data-view="starting">
  <main>
    <h1>OSRS Puzzle Solver</h1>

    <!-- Upload -->
    <section id="upload-view" class="view" hidden>
      <label class="button primary upload-button">
        Upload screenshot
        <input id="file" type="file" accept="image/*">
      </label>
      <p class="hint">Take a screenshot in OSRS with a puzzle box open, then upload it here.</p>
      <p class="privacy">Your screenshot is processed on your device and isn’t uploaded anywhere.</p>
    </section>

    <!-- Analysing -->
    <section id="analysing-view" class="view" hidden>
      <p class="status" role="status" aria-live="polite">Reading puzzle…</p>
    </section>

    <!-- Error -->
    <section id="error-view" class="view" hidden>
      <div class="error" role="alert">
        <h2 id="error-title"></h2>
        <p id="error-text"></p>
      </div>
      <label class="button primary upload-button">
        Try another screenshot
        <input id="file-retry" type="file" accept="image/*">
      </label>
      <p class="privacy">Your screenshot is processed on your device and isn’t uploaded anywhere.</p>
    </section>

    <!-- Walkthrough -->
    <section id="walkthrough-view" class="view" hidden>
      <p id="resumed" class="note" hidden>Resumed where you left off.</p>
      <p id="move-label" class="move-label" aria-live="polite"></p>
      <div id="board" class="board" role="img"></div>
      <div class="controls">
        <button id="previous" type="button" class="button">Previous</button>
      </div>
      <button id="start-over" type="button" class="link-button">Start over</button>
    </section>

  </main>
  <script type="module" src="ui/app.js"></script>
  <!-- Vercel Web Analytics: anonymous page-view counts only (no cookies). -->
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
