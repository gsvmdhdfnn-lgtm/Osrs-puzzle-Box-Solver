<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Puzzle Box Recognition Proof</title>
  <link rel="stylesheet" href="ui/proof.css">
</head>
<body>
  <main>
    <h1>Tree puzzle recognition proof</h1>
    <p class="note">Development page. Everything runs in your browser; nothing is uploaded.</p>

    <section class="controls">
      <label class="file">Screenshot <input id="file" type="file" accept="image/*"></label>
      <button id="sample" type="button">Use test screenshot (IMG_0120)</button>
    </section>

    <p id="status" class="status" role="status">Choose a screenshot with the Tree puzzle box open.</p>

    <section id="result" hidden>
      <div class="columns">
        <div>
          <h2>Detected board</h2>
          <canvas id="overlay"></canvas>
        </div>
        <div>
          <h2>Recognised state</h2>
          <table id="state" class="state"></table>
          <h2>Summary</h2>
          <dl id="summary" class="summary"></dl>
        </div>
      </div>

      <h2>Per-cell diagnostics</h2>
      <div class="scroll"><table id="cells" class="diag"></table></div>

      <h2>Look-alike pairs</h2>
      <div class="scroll"><table id="pairs" class="diag"></table></div>

      <details>
        <summary>Raw diagnostics JSON</summary>
        <pre id="json"></pre>
      </details>
    </section>
  </main>
  <script type="module" src="ui/proof.js"></script>
</body>
</html>
